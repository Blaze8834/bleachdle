<title>Bleach-dle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f1ea;--fg:#111;--mut:#6b675e;--card:#fff;--line:#111;--acc:#ff6a13;--ok:#2e9e4f;--part:#e0a21b;--bad:#c9382f;--tx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0f;--fg:#f2efe8;--mut:#9a958a;--card:#18181b;--line:#f2efe8;--bad:#b3332b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0f;--fg:#f2efe8;--mut:#9a958a;--card:#18181b;--line:#f2efe8;--bad:#b3332b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.4 Inter,system-ui,sans-serif;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:18px 14px 40px}
h1{font:400 clamp(42px,9vw,72px)/.9 Anton,Impact,sans-serif;letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 span{color:var(--acc)}
.sub{color:var(--mut);margin:6px 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:flex;border:2px solid var(--line)}
.tabs button{border:0;background:none;color:var(--fg);font:800 13px Inter;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.in{display:flex;gap:8px;flex:1;min-width:260px}
input{flex:1;min-width:0;border:2px solid var(--line);background:var(--card);color:var(--fg);font:600 15px Inter;padding:10px 12px;border-radius:0}
.btn{border:2px solid var(--line);background:var(--acc);color:#111;font:800 13px Inter;letter-spacing:.08em;text-transform:uppercase;padding:10px 16px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--fg)}
.btn:disabled,input:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:22px;font-weight:600;margin:4px 0 10px}
.wrap{overflow-x:auto;padding-bottom:6px}
.grid{display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(7,minmax(86px,1fr));gap:5px;min-width:780px}
.h{font:800 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:0 2px 2px}
.c{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px 4px;font-weight:600;font-size:13px;color:var(--tx);background:var(--bad);animation:f .5s both;animation-delay:calc(var::i)*.22s);word-break:break-word}
.c.ok{background:var(--ok)}.c.part{background:var(--part);color:#111}
.c.nm{background:var(--card);color:var(--fg);border:2px solid var(--line);align-items:flex-start;text-align:left;padding-left:10px;font-weight:800}
.c b{font-size:20px;line-height:1}
@keyframes f{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.leg{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:14px}
.leg i{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:5px}
.win{background:var(--card);border:2px solid var(--line);padding:16px;margin:12px 0;display:none}
.win h2{font:400 32px Anton,Impact;margin:0 0 4px;text-transform:uppercase;color:var(--acc)}
.win .btn{margin:8px 8px 0 0}
</style></head><body><main>
<h1>Bleach<span>-dle</span></h1>
<p class="sub">Guess the Bleach character. Every guess reveals how close you are.</p>
<div class="bar">
 <div class="tabs"><button id="td" aria-pressed="true">Daily</button><button id="te" aria-pressed="false">Endless</button></div>
 <div class="in"><input id="q" list="dl" placeholder="Pick or type a character…" autocomplete="off"><button class="btn" id="go">Guess</button></div>
</div>
<datalist id="dl"></datalist>
<div class="msg" id="msg"></div>
<div class="win" id="win"><h2 id="wt"></h2><div id="wd"></div><button class="btn" id="sh">Copy result</button><button class="btn alt" id="nx">New character</button></div>
<div class="wrap"><div class="grid" id="g"></div></div>
<div class="leg"><span><i style="background:var(--ok)"></i>Correct</span><span><i style="background:var(--part)"></i>Partly matches / Close</span><span><i style="background:var(--bad)"></i>Wrong</span><span>↑ answer is higher / later &nbsp; ↓ answer is lower / earlier</span></div>
</main>

const ARCS=["Agent of the Shinigami","Soul Society: Sneak Entry","Soul Society: Rescue","Arrancar: Arrival","Hueco Mundo: Infiltration","Arrancar: Fake Karakura Town","Turn Back the Pendulum","Lost Substitute Shinigami","Thousand-Year Blood War: The Blood Warfare","Everything But the Rain","Thousand-Year Blood War: The Separation","Thousand-Year Blood War: The Conflict","Thousand-Year Blood War: The Calamity","Manga Finale (Ch. 686)","CFYOW Novel","No Breaths From Hell"];
const COLS=["Character","Gender","Race","Age","Height","Hair","Squad / ID","First Arc"];
const $=id=>document.getElementById(id);
let mode="daily",target=null,guesses=[],done=false;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

function getDailyTarget(){
  const params = new URLSearchParams(window.location.search);
  const targetParam = params.get("target");
  if(targetParam) {
    const found = D.find(d => d[0].toLowerCase() === targetParam.toLowerCase());
    if(found) return found;
  }
  const customDaily = store.get("bleachdle-custom-daily");
  if(customDaily) {
    const found = D.find(d => d[0] === customDaily);
    if(found) return found;
  }
  const str = "bleach-dle-" + today();
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  const index = Math.abs(hash) % D.length;
  return D[index];
}

const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const parts=s=>s.split("/");
function cat(g,t){if(g===t)return"ok";return parts(g).some(x=>parts(t).includes(x))?"part":"bad"}

function num(g,t,txt){
  if(g===t)return["ok",txt];
  return["bad",txt+` <b>${t>g?"↑":"↓"}</b>`];
}

function heightNum(g,t){
  if(g===t)return["ok",g+" cm"];
  const diff=Math.abs(t-g);
  const status=diff<=3?"part":"bad";
  return[status,g+" cm <b>"+(t>g?"↑":"↓")+"</b>"];
}

function arcNum(g,t){
  const gIdx=ARCS.indexOf(g);
  const tIdx=ARCS.indexOf(t);
  if(gIdx===tIdx)return["ok",g];
  const diff=Math.abs(tIdx-gIdx);
  const status=diff===1?"part":"bad";
  return[status,g+` <b>${tIdx>gIdx?"↑":"↓"}</b>`];
}

function parseNum(val) {
  if (typeof val === "number") return val;
  const match = String(val).match(/\d+/);
  return match ? parseInt(match[0], 10) : null;
}

function squadNum(gRow, tRow){
  const g = gRow[7];
  const t = tRow[7];
  const gRace = gRow[2];
  const tRace = tRow[2];

  if(g === t) return ["ok", g];

  const getGroupType = (val, race) => {
    if (val.startsWith("Squad")) return "Squad";
    if (val.startsWith("Arrancar")) return "Arrancar";
    if (val.startsWith("Schrift")) return "Schrift";
    return race;
  };

  const gType = getGroupType(g, gRace);
  const tType = getGroupType(t, tRace);

  if (gType !== tType) {
    return ["bad", g];
  }

  const gNum = parseNum(g);
  const tNum = parseNum(t);

  if (gNum !== null && tNum !== null) {
    const diff = Math.abs(tNum - gNum);
    const status = diff <= 2 ? "part" : "bad";
    return [status, g + ` <b>${tNum > gNum ? "↑" : "↓"}</b>`];
  }

  const gLetterMatch = g.match(/Schrift ([A-Z])/);
  const tLetterMatch = t.match(/Schrift ([A-Z])/);

  if (gLetterMatch && tLetterMatch) {
    const gCode = gLetterMatch[1].charCodeAt(0);
    const tCode = tLetterMatch[1].charCodeAt(0);
    const diff = Math.abs(tCode - gCode);
    const status = diff <= 2 ? "part" : "bad";
    return [status, g + ` <b>${tCode > gCode ? "↑" : "↓"}</b>`];
  }

  return ["bad", g];
}

function row(g,t){
  return [
    ["nm",g[0]],
    [g[1]===t[1]?"ok":"bad",g[1]],
    [cat(g[2],t[2]),g[2]],
    num(g[4],t[4],g[3]),
    heightNum(g[5],t[5]),
    [g[6]===t[6]?"ok":"bad",g[6]],
    squadNum(g,t),
    arcNum(g[8],t[8])
  ];
}

function render(animate){
 const g=$("g");g.innerHTML=COLS.map(c=>`<div class="h">${c}</div>`).join("");
 [...guesses].reverse().forEach((n,ri)=>{const gr=D.find(d=>d[0]===n);
  row(gr,target).forEach((c,i)=>{const e=document.createElement("div");e.className="c "+c[0];e.style.setProperty("--i",animate&&ri===0?i:0);e.innerHTML=c[1];g.appendChild(e)})});
 
 const dl=$("dl");dl.innerHTML=D.map(d=>d[0]).filter(n=>!guesses.includes(n)).sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${n.replace(/"/g,"&quot;")}">`).join("");
 $("q").disabled=$("go").disabled=done;
 $("nx").style.display=mode==="endless"?"inline-block":"none";
 const w=$("win");w.style.display=done?"block":"none";
 if(done){const won=guesses.includes(target[0]);$("wt").textContent=won?"It’s "+target[0]+"!":"The answer was "+target[0];
  $("wd").textContent=won?`Solved in ${guesses.length} ${guesses.length===1?"guess":"guesses"}.`:"";}
}

function save(){if(mode==="daily")store.set("bleachdle-"+today(),{g:guesses,d:done})}

function start(m,fresh){
 mode=m;$("td").setAttribute("aria-pressed",m==="daily");$("te").setAttribute("aria-pressed",m==="endless");$("msg").textContent="";$("q").value="";
 if(m==="daily"){target=getDailyTarget();const s=store.get("bleachdle-"+today())||{g:[],d:false};guesses=s.g;done=s.d;
  $("msg").textContent="A new daily character appears at midnight (your local time)."}
 else{target=D[Math.floor(Math.random()*D.length)];guesses=[];done=false}
 render(false);
}

function guess(){
 if(done)return;const v=$("q").value.trim().toLowerCase();if(!v)return;
 let m=D.filter(d=>d[0].toLowerCase()===v);if(!m.length)m=D.filter(d=>d[0].toLowerCase().startsWith(v));
 if(m.length!==1){$("msg").textContent=m.length?"Be more specific — several characters match.":"No character by that name. Pick one from the list.";return}
 const n=m[0][0];if(guesses.includes(n)){$("msg").textContent="Already guessed.";return}
 guesses.push(n);$("msg").textContent="";$("q").value="";
 if(n===target[0])done=true;save();render(true);
 if(done)setTimeout(()=>$("win").scrollIntoView({behavior:"smooth",block:"nearest"}),1900);
}

$("go").onclick=guess;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")guess()});
$("td").onclick=()=>start("daily");$("te").onclick=()=>start("endless");$("nx").onclick=()=>start("endless");

$("sh").onclick=()=>{
 const sq=guesses.map(n=>{const gr=D.find(d=>d[0]===n);return row(gr,target).slice(1).map(c=>c[0]==="ok"?"🟩":c[0]==="part"?"🟨":"🟥").join("")}).join("\n");
 const t=`Bleach-dle ${mode==="daily"?today():"(Endless)"} — ${guesses.length} guesses\n${sq}`;
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$("sh").textContent="Copied!").catch(()=>$("sh").textContent="Copy not available");
 setTimeout(()=>$("sh").textContent="Copy result",1800);
};

// Console Dev API
window.bleachDev = {
  setTarget(name) {
    const found = D.find(d => d[0].toLowerCase() === name.toLowerCase());
    if(!found) {
      console.error(`Character "${name}" not found! Check spelling.`);
      return;
    }
    store.set("bleachdle-custom-daily", found[0]);
    start("daily");
    console.log(`%c[Dev] Daily target successfully set to: ${found[0]}`, "color: #ff6a13; font-weight: bold;");
  },
  copyLink(name) {
    const found = D.find(d => d[0].toLowerCase() === name.toLowerCase());
    if(!found) {
      console.error(`Character "${name}" not found! Check spelling.`);
      return;
    }
    const link = window.location.origin + window.location.pathname + "?target=" + encodeURIComponent(found[0]);
    navigator.clipboard.writeText(link).then(() => {
      console.log(`%c[Dev] Copied shareable link for ${found[0]} to clipboard!`, "color: #2e9e4f; font-weight: bold;");
    });
  },
  listCharacters() {
    return D.map(d => d[0]);
  }
};

start("daily");
